import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.lemon.mrs'
    compileSdk 37
    compileSdkMinor 2
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.lemon.mrs'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '0.4.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DMRS_BUILD_CLI=OFF'
                cppFlags '-fno-exceptions -fno-rtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            if (System.getenv('MRS_KEYSTORE') != null) {
                storeFile file(System.getenv('MRS_KEYSTORE'))
                storePassword System.getenv('MRS_STORE_PASSWORD')
                keyAlias System.getenv('MRS_KEY_ALIAS')
                keyPassword System.getenv('MRS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('MRS_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildFeatures {
        compose true
        buildConfig false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

dependencies {
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-nav-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
}
