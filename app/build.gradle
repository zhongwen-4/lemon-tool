plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lemon.mrs'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.lemon.mrs'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DMRS_BUILD_CLI=OFF'
                cppFlags '-fno-exceptions -fno-rtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            if (System.getenv('MRS_KEYSTORE') != null) {
                storeFile file(System.getenv('MRS_KEYSTORE'))
                storePassword System.getenv('MRS_STORE_PASSWORD')
                keyAlias System.getenv('MRS_KEY_ALIAS')
                keyPassword System.getenv('MRS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('MRS_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildFeatures {
        buildConfig false
    }
}
