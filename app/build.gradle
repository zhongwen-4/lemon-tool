import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.lemon.mrs'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.lemon.mrs'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '0.2.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DMRS_BUILD_CLI=OFF'
                cppFlags '-fno-exceptions -fno-rtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        release {
            if (System.getenv('MRS_KEYSTORE') != null) {
                storeFile file(System.getenv('MRS_KEYSTORE'))
                storePassword System.getenv('MRS_STORE_PASSWORD')
                keyAlias System.getenv('MRS_KEY_ALIAS')
                keyPassword System.getenv('MRS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('MRS_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildFeatures {
        compose true
        buildConfig false
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'top.yukonga.miuix.kmp:miuix-android:0.8.8'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.8.8'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui:1.9.5'
    implementation 'androidx.compose.foundation:foundation:1.9.5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
