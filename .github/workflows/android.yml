name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S core -B build/host -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/host --parallel

      - name: Run scanner tests
        shell: pwsh
        run: ./core/tests/run_tests.ps1 -Exe build/host/mrs

  apk:
    name: apk (arm64-v8a)
    runs-on: ubuntu-latest
    needs: core
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu runner 自带 Android SDK；android-actions/setup-android 默认安装的
      # "tools" 包已从 SDK 仓库下架，会让整个 job 直接失败，因此直接调用自带 sdkmanager
      - name: Install NDK, CMake and platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          sdkmanager="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" \
            "cmake;3.22.1" "ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" app/build.gradle | head -n1)"
          if [ -z "$app_version" ]; then
            echo "无法从 app/build.gradle 读取 versionName" >&2
            exit 1
          fi
          if [ "$tag_version" != "$app_version" ]; then
            echo "tag $GITHUB_REF_NAME 与 app versionName $app_version 不一致" >&2
            exit 1
          fi

      - name: Prepare signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MRS_KEYSTORE_BASE64: ${{ secrets.MRS_KEYSTORE_BASE64 }}
          MRS_STORE_PASSWORD_SECRET: ${{ secrets.MRS_STORE_PASSWORD }}
          MRS_KEY_ALIAS_SECRET: ${{ secrets.MRS_KEY_ALIAS }}
          MRS_KEY_PASSWORD_SECRET: ${{ secrets.MRS_KEY_PASSWORD }}
        run: |
          umask 077
          key_store="$RUNNER_TEMP/release.jks"
          : "${MRS_KEYSTORE_BASE64:?tag 发布必须配置 MRS_KEYSTORE_BASE64 secret}"
          : "${MRS_STORE_PASSWORD_SECRET:?tag 发布必须配置 MRS_STORE_PASSWORD secret}"
          : "${MRS_KEY_ALIAS_SECRET:?tag 发布必须配置 MRS_KEY_ALIAS secret}"
          : "${MRS_KEY_PASSWORD_SECRET:?tag 发布必须配置 MRS_KEY_PASSWORD secret}"
          printf '%s' "$MRS_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          test -s "$key_store"
          keytool -list -keystore "$key_store" -storepass "$MRS_STORE_PASSWORD_SECRET" \
            -alias "$MRS_KEY_ALIAS_SECRET" >/dev/null
          echo "MRS_KEYSTORE=$key_store" >> "$GITHUB_ENV"
          printf 'MRS_STORE_PASSWORD=%s\n' "$MRS_STORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          printf 'MRS_KEY_ALIAS=%s\n' "$MRS_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          printf 'MRS_KEY_PASSWORD=%s\n' "$MRS_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Generate temporary test signing key
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          umask 077
          key_store="$RUNNER_TEMP/release.jks"
          keytool -genkeypair -keystore "$key_store" \
            -storepass android -keypass android -alias mrs \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=mrs,OU=dev,O=lemon_tool,C=CN"
          echo "MRS_KEYSTORE=$key_store" >> "$GITHUB_ENV"
          echo 'MRS_STORE_PASSWORD=android' >> "$GITHUB_ENV"
          echo 'MRS_KEY_ALIAS=mrs' >> "$GITHUB_ENV"
          echo 'MRS_KEY_PASSWORD=android' >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Check APK size
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          bytes=$(stat -c%s "$apk")
          echo "$apk is $((bytes / 1024)) KiB"
          # MiuiX/Compose 体系本身就有几 MB 体积，比纯 View 外壳大得多，预算相应放宽
          if [ "$bytes" -gt 12582912 ]; then
            echo "APK 超过 12 MiB 预算，检查是否引入了多余依赖或多余的 ABI" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mrs-apk
          path: app/build/outputs/apk/release/*.apk

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mrs-apk
          path: artifact

      # git tag v0.2.0 && git push --tags 时把 APK 挂到 Release 上。
      # app 的「检查更新」就是读 releases/latest 的 tag 跟已安装版本比对。
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="$(find artifact -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes "CI 自动构建的 $GITHUB_REF_NAME，使用仓库固定发布密钥签名。"
          fi
          gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
