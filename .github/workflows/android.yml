name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S core -B build/host -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/host --parallel

      - name: Run scanner tests
        shell: pwsh
        run: ./core/tests/run_tests.ps1 -Exe build/host/mrs

  apk:
    name: apk (arm64-v8a)
    runs-on: ubuntu-latest
    permissions:
      contents: write # 推 v* tag 时用 gh 建 Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu runner 自带 Android SDK；android-actions/setup-android 默认安装的
      # "tools" 包已从 SDK 仓库下架，会让整个 job 直接失败，因此直接调用自带 sdkmanager
      - name: Install NDK, CMake and platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          sdkmanager="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" \
            "cmake;3.22.1" "ndk;27.0.12077973"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" \
            -storepass android -keypass android -alias mrs \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=mrs,OU=dev,O=lemon_tool,C=CN"

      - name: Build release APK
        env:
          MRS_KEYSTORE: ${{ runner.temp }}/release.jks
          MRS_STORE_PASSWORD: android
          MRS_KEY_ALIAS: mrs
          MRS_KEY_PASSWORD: android
        run: gradle assembleRelease --no-daemon

      - name: Check APK size
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          bytes=$(stat -c%s "$apk")
          echo "$apk is $((bytes / 1024)) KiB"
          # MiuiX/Compose 体系本身就有几 MB 体积，比纯 View 外壳大得多，预算相应放宽
          if [ "$bytes" -gt 12582912 ]; then
            echo "APK 超过 12 MiB 预算，检查是否引入了多余依赖或多余的 ABI" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: mrs-apk
          path: app/build/outputs/apk/release/*.apk

      # git tag v0.2.0 && git push --tags 时把 APK 挂到 Release 上。
      # app 的「检查更新」就是读 releases/latest 的 tag 跟已安装版本比对。
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "$GITHUB_REF_NAME" \
            --notes "CI 自动构建的 $GITHUB_REF_NAME，签名与 CI 一致，仅供测试。"
